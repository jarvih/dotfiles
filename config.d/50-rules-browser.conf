# apply mark for Xwayland and wayland native browser windows
for_window [class="Chromium-browser"] mark Browser
for_window [class="Brave-browser"] mark Browser
for_window [class="firefox"]  mark Browser
for_window [app_id="Chromium-browser"] mark Browser
for_window [app_id="brave-browser"] mark Browser
for_window [app_id="firefox"] mark Browser
for_window [app_id="microsoft-edge"] mark Browser

# inhibit scrensaver for fullscreen browser windows
for_window [con_mark="Browser"] {
    inhibit_idle fullscreen
}

# firefox wayland screensharing indicator
for_window [app_id="firefox" title="Firefox — Sharing Indicator"] {
    floating enable
}


# Edge hover card / link preview popup: empty app_id, empty title, tiny window
# Prevent it from being tiled and stealing focus
for_window [app_id="^$" title="^$"] floating enable
no_focus [app_id="^$"]
for_window [app_id="microsoft-edge" window_type="dialog"] floating enable
for_window [app_id="microsoft-edge" window_type="utility"] floating enable
for_window [app_id="microsoft-edge" window_type="tooltip"] floating enable
