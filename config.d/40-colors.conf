# Tokyo Night colors
set $bg      #1a1b26
set $bg2     #292e42
set $fg      #c0caf5
set $dim     #565f89
set $blue    #7aa2f7
set $cyan    #7dcfff
set $green   #9ece6a
set $red     #f7768e
set $yellow  #e0af68

# class                 border  bg    text  indicator child_border
client.focused          $blue   $bg2  $fg   $cyan     $blue
client.focused_inactive $bg2    $bg   $dim  $bg2      $bg2
client.unfocused        $bg2    $bg   $dim  $bg2      $bg2
client.urgent           $red    $red  $fg   $red      $red
