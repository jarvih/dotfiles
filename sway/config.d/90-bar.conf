# Status bar: intentionally empty
#
# Overrides /usr/share/sway/config.d/90-bar.conf and its
# `bar { swaybar_command waybar }`, so sway does not spawn a waybar of its own.
# `layered-include` in /etc/sway/config picks config.d files by basename, so
# this one replaces the distro file.
#
# Waybar runs from the waybar.service user unit instead, see
# ../../waybar/README.md.
